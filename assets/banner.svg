<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Vassell Enha Atthayya — Full Stack Developer — Persona 5 inspired portfolio" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="380" fill="#0f0f0f"/>
  <!-- pecahan merah -->
  <polygon points="0,0 560,0 430,380 0,380" fill="#dc0000"/>
  <polygon points="560,0 640,0 510,380 430,380" fill="#f5f5f5"/>
  <polygon points="640,0 700,0 570,380 510,380" fill="#0f0f0f"/>
  <polygon points="0,300 310,380 0,380" fill="#0f0f0f"/>
  <polygon points="1200,0 1200,120 1020,0" fill="#dc0000"/>
  <polygon points="1200,380 1200,300 1090,380" fill="#f5f5f5"/>
  <!-- kicker -->
  <g transform="translate(60 44) skewX(-12)">
    <rect width="330" height="38" fill="#0f0f0f"/>
    <text x="14" y="27" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="22" font-style="italic" fill="#f5f5f5" textLength="302" lengthAdjust="spacingAndGlyphs">ALL-OUT ATTACK // PORTFOLIO</text>
  </g>
  <!-- nama: kotak putih teks hitam + kotak hitam teks putih -->
  <g transform="translate(58 118) skewX(-12) rotate(-2)">
