    <text x="20" y="66" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" fill="#0f0f0f" textLength="520" lengthAdjust="spacingAndGlyphs">VASSELL ENHA</text>
  </g>
  <g transform="translate(120 216) skewX(-12) rotate(-2)">
    <rect width="500" height="88" fill="#0f0f0f" stroke="#f5f5f5" stroke-width="4"/>
    <text x="20" y="66" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="58" font-style="italic" font-weight="900" fill="#f5f5f5" textLength="460" lengthAdjust="spacingAndGlyphs">ATTHAYYA</text>
  </g>
  <!-- sisi kanan -->
  <g transform="translate(800 120) skewX(-12)">
