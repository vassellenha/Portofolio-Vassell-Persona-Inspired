    <text x="16" y="38" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="32" font-style="italic" fill="#f5f5f5" textLength="288" lengthAdjust="spacingAndGlyphs">FULL STACK DEV</text>
  </g>
  <g transform="translate(780 184) skewX(-12)">
