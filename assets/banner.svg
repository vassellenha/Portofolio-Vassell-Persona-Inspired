  </g>
  <text x="800" y="318" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="22" font-style="italic" fill="#f5f5f5" transform="skewX(-12)" textLength="300" lengthAdjust="spacingAndGlyphs">STEAL THE SPOTLIGHT.</text>
  <text x="780" y="350" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="22" font-style="italic" fill="#dc0000" transform="skewX(-12)" textLength="260" lengthAdjust="spacingAndGlyphs">SHIP THE CODE.</text>
